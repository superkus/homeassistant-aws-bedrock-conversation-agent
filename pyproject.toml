[project]
name = "homeassistant-bedrock-conversation"
version = "2.0.0"
description = "AWS Bedrock conversation agent for Home Assistant"
readme = "README.md"
license = { text = "MIT" }
# Home Assistant 2026.11 requires Python 3.14.2 or newer.
requires-python = ">=3.14.2"

[project.urls]
Homepage = "https://github.com/superkus/homeassistant-aws-bedrock-conversation-agent"
"Forked from" = "https://github.com/cronus42/homeassistant-aws-bedrock-conversation-agent"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true
