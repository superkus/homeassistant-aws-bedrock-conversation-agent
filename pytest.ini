[pytest]
testpaths = tests
norecursedirs = .git
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
# Let Home Assistant install its httpx alias before respx is imported
# (as recommended by the pytest-homeassistant package).
addopts = -p no:respx
log_format = %(asctime)s.%(msecs)03d %(levelname)-8s %(name)s:%(filename)s:%(lineno)d %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
